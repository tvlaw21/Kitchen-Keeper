<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Keeper - Calendar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="device-container">
    <header class="app-header">
      <h1 class="app-title">Let's plan...</h1>
      <div class="calendar-view-toggle">
        <button id="btn-week-view" class="btn-toggle">Week</button>
        <button id="btn-month-view" class="btn-toggle" style="font-weight: bold;">Month</button>
      </div>
      <div class="calendar-header-month">
        <i id="prev-month" class="fas fa-chevron-left"></i>
        <span id="month-year-display">October 2026</span>
        <i id="next-month" class="fas fa-chevron-right"></i>
      </div>
    </header>

    <main class="app-content">
      <div id="notification-area"></div>
      <div class="calendar-grid" id="calendar-grid-container">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>
    </main>

    <!-- Modal for viewing / scheduling meals -->
    <dialog id="meal-modal" class="dialog-box">
      <h2 class="app-title" id="modal-date-title">Schedule Meal</h2>
      <p id="modal-current-meal" style="margin-bottom: 10px; font-weight: bold; color: var(--color-title);"></p>
      <p style="margin-bottom: 12px; font-size: 14px;">Select or change the recipe for this date:</p>
      <select id="recipe-select" class="text-input" style="width: 100%; margin-bottom: 16px;">
        <option value="Blueberry Pancakes">Blueberry Pancakes</option>
        <option value="Salmon Fried Rice">Salmon Fried Rice</option>
        <option value="Cafe Latté">Cafe Latté</option>
        <option value="Dairy-Free Tzatziki">Dairy-Free Tzatziki</option>
      </select>
      <div style="display: flex; gap: 10px;">
        <button id="save-meal-btn" class="btn-primary" style="flex: 1;">Save Meal</button>
        <button id="close-meal-modal" class="btn-toggle" style="flex: 1;">Cancel</button>
      </div>
    </dialog>

    <nav class="bottom-nav">
      <a href="recipes.html" class="nav-item">
        <i class="fas fa-utensils"></i>
        <span>recipes</span>
      </a>
      <a href="shopping.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>shopping</span>
      </a>
      <a href="index.html" class="nav-item">
        <i class="fas fa-archive"></i>
        <span>pantry</span>
      </a>
      <a href="calendar.html" class="nav-item active">
        <i class="fas fa-calendar-alt"></i>
        <span>Calendar</span>
      </a>
    </nav>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
