<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Keeper - Calendar</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="device-container">
    <header class="app-header">
      <h1 class="app-title">Let's plan...</h1>
      <div class="calendar-view-toggle">
        <button id="btn-week-view" class="btn-toggle">Week</button>
        <button id="btn-month-view" class="btn-toggle" style="font-weight: bold;">Month</button>
      </div>
      <div class="calendar-header-month">
        <i class="fas fa-chevron-left"></i>
        <span>October 2026</span>
        <i class="fas fa-chevron-right"></i>
      </div>
    </header>
		
		<!-- Meal Scheduling Modal -->
		<dialog id="meal-modal" class="dialog-box">
			<h2 class="app-title">Schedule Meal</h2>
			<p class="dialog-text">Select a recipe for this day:</p>
			<select id="recipe-select" class="text-input" style="width: 100%; margin-bottom: 20px;">
				<option value="Blueberry Pancakes">Blueberry Pancakes</option>
				<option value="Salmon Fried Rice">Salmon Fried Rice</option>
				<option value="Cafe Latté">Cafe Latté</option>
			</select>
			<button id="save-meal-btn" class="btn-toggle" style="margin-bottom: 10px;">Schedule & Sync Shopping List</button>
			<button id="close-meal-modal" class="btn-toggle">Cancel</button>
		</dialog>

    <main class="app-content">
      <div class="calendar-grid">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>

        <!-- Example Grid Days -->
        <div class="day-cell"><span></span></div>
        <div class="day-cell"><span></span></div>
        <div class="day-cell"><span></span></div>
        <div class="day-cell"><span></span></div>
        <div class="day-cell"><span>1</span></div>
        <div class="day-cell"><span>2</span></div>
        <div class="day-cell"><span>3</span></div>

        <div class="day-cell"><span>4</span></div>
        <div class="day-cell"><span>5</span><div class="meal-dot"></div></div>
        <div class="day-cell"><span>6</span><div class="meal-dot"></div></div>
        <div class="day-cell"><span>7</span><div class="meal-dot"></div></div>
        <div class="day-cell"><span>8</span><div class="meal-dot"></div></div>
        <div class="day-cell"><span>9</span><div class="meal-dot"></div></div>
        <div class="day-cell"><span>10</span></div>

        <div class="day-cell"><span>11</span></div>
        <div class="day-cell"><span>12</span></div>
        <div class="day-cell"><span>13</span></div>
        <div class="day-cell"><span>14</span></div>
        <div class="day-cell"><span>15</span></div>
        <div class="day-cell"><span>16</span></div>
        <div class="day-cell"><span>17</span></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="recipes.html" class="nav-item">
        <i class="fas fa-utensils"></i>
        <span>recipes</span>
      </a>
      <a href="shopping.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>shopping</span>
      </a>
      <a href="index.html" class="nav-item">
        <i class="fas fa-archive"></i>
        <span>pantry</span>
      </a>
      <a href="calendar.html" class="nav-item active">
        <i class="fas fa-calendar-alt"></i>
        <span>Calendar</span>
      </a>
    </nav>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
