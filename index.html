<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Keeper - Pantry</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Font Awesome 5 per Visual Style Guide -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="device-container">
    <header class="app-header">
      <h1 class="app-title">What you have...</h1>
    </header>

    <main class="app-content">
      <table class="pantry-table">
        <thead>
          <tr>
            <th>Items</th>
            <th>Count</th>
            <th>Exp. Date</th>
          </tr>
        </thead>
        <tbody id="pantry-list">
          <tr>
            <td>Eggs</td>
            <td>
              <div class="qty-control">
                <button class="btn-qty btn-minus">-</button>
                <span class="qty-val">6</span>
                <button class="btn-qty btn-plus">+</button>
              </div>
            </td>
            <td>10/20/2026</td>
          </tr>
          <tr>
            <td>Milk</td>
            <td>
              <div class="qty-control">
                <button class="btn-qty btn-minus">-</button>
                <span class="qty-val">1 gal</span>
                <button class="btn-qty btn-plus">+</button>
              </div>
            </td>
            <td>10/17/2026</td>
          </tr>
          <tr>
            <td>Bread</td>
            <td>
              <div class="qty-control">
                <button class="btn-qty btn-minus">-</button>
                <span class="qty-val">12 slices</span>
                <button class="btn-qty btn-plus">+</button>
              </div>
            </td>
            <td>10/24/2026</td>
          </tr>
        </tbody>
      </table>
    </main>

    <nav class="bottom-nav">
      <a href="recipes.html" class="nav-item">
        <i class="fas fa-utensils"></i>
        <span>recipes</span>
      </a>
      <a href="shopping.html" class="nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>shopping</span>
      </a>
      <a href="index.html" class="nav-item active">
        <i class="fas fa-archive"></i>
        <span>pantry</span>
      </a>
      <a href="calendar.html" class="nav-item">
        <i class="fas fa-calendar-alt"></i>
        <span>Calendar</span>
      </a>
    </nav>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
